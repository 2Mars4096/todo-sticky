name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing version tag to build and publish'
        required: true
        type: string

concurrency:
  group: release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target universal-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          cache-on-failure: true
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils
      - name: Install JS dependencies
        run: npm ci
      - name: Verify release inputs and updater behavior
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo "Missing updater signing key"; exit 1; }
          node -e 'const expected = "v" + require("./package.json").version; if (process.env.RELEASE_TAG !== expected) throw new Error("Release tag must match package.json")'
          node tests/app-updates.cjs
          node tests/update-persistence.cjs
          node tests/update-manifest.cjs
          node tests/task-completion.cjs
          node tests/calendar-rollover.cjs
      # Tauri combines the GUI executable for universal macOS, but the sibling
      # task API binary also needs a universal file before the bundler copies it.
      - name: Build universal task API
        if: matrix.platform == 'macos-latest'
        run: |
          npm run build:frontend
          cargo build --manifest-path src-tauri/Cargo.toml --release --locked --target aarch64-apple-darwin --bin sticky-todo-api
          cargo build --manifest-path src-tauri/Cargo.toml --release --locked --target x86_64-apple-darwin --bin sticky-todo-api
          mkdir -p src-tauri/target/universal-apple-darwin/release
          lipo -create src-tauri/target/aarch64-apple-darwin/release/sticky-todo-api src-tauri/target/x86_64-apple-darwin/release/sticky-todo-api -output src-tauri/target/universal-apple-darwin/release/sticky-todo-api
      - name: Build signed installers
        uses: tauri-apps/tauri-action@v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 7
          path: |
            src-tauri/target/**/bundle/**/*.sig
            src-tauri/target/**/bundle/**/*.tar.gz
            src-tauri/target/**/bundle/**/*.dmg
            src-tauri/target/**/bundle/**/*.exe
            src-tauri/target/**/bundle/**/*.msi
            src-tauri/target/**/bundle/**/*.AppImage
            src-tauri/target/**/bundle/**/*.deb
            src-tauri/target/**/bundle/**/*.rpm

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
      - name: Prepare and validate updater manifest
        run: |
          node scripts/prepare-update-release.cjs release-artifacts release-upload
          node scripts/validate-update-manifest.cjs release-upload/latest.json
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > release-draft.txt; then
            test "$(cat release-draft.txt)" = true || { echo "Refusing to replace a published release"; exit 1; }
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" release-upload/* --clobber
          gh release view "$RELEASE_TAG" --json tagName,isDraft,assets > uploaded-assets.json
          node scripts/validate-release-assets.cjs release-upload/latest.json uploaded-assets.json
          gh release edit "$RELEASE_TAG" --draft=false --latest
          gh release view "$RELEASE_TAG" --json tagName,isDraft,assets > published-assets.json
          node scripts/validate-release-assets.cjs release-upload/latest.json published-assets.json
