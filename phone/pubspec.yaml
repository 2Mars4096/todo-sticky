name: sticky_todo
description: Dockit, the pipedreams proposal and task planner for iPhone and Android.
publish_to: none
version: 2.1.20+35
environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.47.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.6.0
  crypto: ^3.0.7
  url_launcher: ^6.3.2
  path_provider: ^2.1.5
  flutter_secure_storage: ^10.0.0
  intl: ^0.20.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/brand/dockit.png
    - assets/brand/suite-mynit.png
    - assets/brand/suite-shiprite.png
