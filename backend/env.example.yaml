# Copy to ignored backend/env.yaml and use your project's public Firebase web config.
GOOGLE_CLOUD_PROJECT: "your-project-id"
FIREBASE_WEB_API_KEY: "your-firebase-web-api-key"
FIREBASE_AUTH_DOMAIN: "your-project-id.firebaseapp.com"
FIREBASE_WEB_APP_ID: "your-firebase-web-app-id"
FIREBASE_SERVICE_ACCOUNT_ID: "sticky-sync@your-project-id.iam.gserviceaccount.com"
ALLOWED_ORIGINS: "tauri://localhost,http://tauri.localhost,https://tauri.localhost,http://localhost:5173"
# Restrict a personal deployment to your email. Empty permits verified Google users.
ALLOWED_EMAILS: "you@example.com"
