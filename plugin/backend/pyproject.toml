[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "diane-todo-plugin"
version = "0.1.6"
description = "Product-owned Diane compatibility release"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]
include = ["diane.plugins*"]
namespaces = true
