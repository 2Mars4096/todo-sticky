[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "diane-todo-plugin"
version = "0.1.2"
requires-python = ">=3.11"
description = "Product-owned Diane compatibility release"

[tool.setuptools.packages.find]
where = ["."]
include = ["diane*"]
namespaces = true
